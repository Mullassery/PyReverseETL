[package]
name = "pyreverseetl-core"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.8", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
parking_lot = "0.12"
# Adapter support
base64 = "0.22"
# HTTP client (json feature for async connectors, blocking feature for the
# synchronous DestinationAdapter trait used by webhook/salesforce/hubspot/marketo)
# reqwest 0.12 pulls h2 0.4 (clears RUSTSEC-2026-0258 on h2 0.3) and rustls 0.23
# / webpki 0.103 (clears rustls-webpki 0.101 advisories).
reqwest = { version = "0.12", features = ["json", "blocking"] }
backoff = { version = "0.4", features = ["tokio"] }
# StatGuardian integration (HTTP API client)
opentelemetry = "0.22"
opentelemetry-http = "0.11"
rdkafka = { version = "0.36", features = ["cmake-build", "ssl-vendored", "gssapi", "libz"] }
# Real database connectors (PostgreSQL / MySQL)
# sqlx 0.8 is required to clear the RUSTSEC-2024-0363 advisory on 0.7.4 and to
# drop the rustls 0.21.x transitive dependency (pulled via tokio-rustls 0.24).
# 0.8 is a breaking migration: see postgres.rs/mysql.rs for the API updates.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "mysql", "chrono", "json"] }
# Real S3-compatible object storage connector (also used against MinIO in tests)
# default-features = false drops the `rustls` feature, which selects aws-smithy-runtime's
# legacy-rustls-ring TLS backend (rustls 0.21 / h2 0.3 / webpki 0.101, all advisory-listed).
# default-https-client selects the modern rustls-aws-lc backend (rustls 0.23 / h2 0.4)
# instead, clearing those advisories.
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "sigv4a", "http-1x", "rt-tokio"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
bytes = "1"

# Web source connector: crawl sites with the MudFish engine. Pinned to the
# Rust workspace release tag (not a raw commit) so upgrades are deliberate.
mudfish-core = { git = "https://github.com/Mullassery/MudFish", tag = "rust-v0.1.3" }
mudfish-engine = { git = "https://github.com/Mullassery/MudFish", tag = "rust-v0.1.3" }
url = "2"

[[bin]]
name = "pyreverseetl-dashboard"
path = "bin/pyreverseetl_dashboard.rs"
