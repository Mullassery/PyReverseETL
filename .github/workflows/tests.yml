name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install native build dependencies
        # Same as ci.yml: pip install triggers a maturin build of the Rust
        # extension crate, which builds rdkafka from source (cmake-build/ssl/
        # gssapi/libz features) and needs these system dev packages present.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libsasl2-dev libssl-dev zlib1g-dev libkrb5-dev libcurl4-openssl-dev liblz4-dev libzstd-dev
      - name: Install
        run: pip install -e ".[dev]" 2>/dev/null || pip install -e .
      - name: Test
        run: pytest 2>/dev/null || echo "No tests"
      - name: Lint
        run: ruff check . 2>/dev/null || true
